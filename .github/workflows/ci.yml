name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pipka
          POSTGRES_PASSWORD: pipka-ci
          POSTGRES_DB: pipka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipka"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://pipka:pipka-ci@127.0.0.1:5432/pipka
      POSTGRES_PASSWORD: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install ".[dev]" gunicorn
          pip install --no-deps markdownify==0.14.1

      - name: Validate Python
        run: |
          ruff check --select F,E9 app tests alembic
          pytest -q

      - name: Reject committed credentials
        run: python scripts/check_secrets.py

      - name: Validate browser JavaScript and CSP contracts
        run: node scripts/check_inline_js.mjs

      - name: Validate Compose
        run: |
          # docker-compose.yml loads env_file: .env, which is never committed.
          cp .env.example .env
          docker compose config -q

      - name: Validate fresh database migration
        run: |
          alembic upgrade head
          alembic current
